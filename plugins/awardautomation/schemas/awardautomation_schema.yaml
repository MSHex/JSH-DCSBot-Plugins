schema;element_schema:
  type: map
  nullable: false
  mapping:
    enabled:
      type: bool
      nullable: false
      desc: Whether the award scanner runs at all.
      example: 'true'
    scan_interval_minutes:
      type: int
      nullable: false
      range:
        min: 1
        max: 1440
      desc: Minutes between scans for newly qualifying pilots.
      example: '30'
    campaign_id:
      type: int
      nullable: false
      range:
        min: 1
      desc: Campaign the figures are read from.
      example: '1'
    hardcore:
      include: hardcore_settings
    bootstrap_existing:
      type: bool
      nullable: false
      desc: On first run, grant awards to pilots who already qualify rather than only to those who qualify
        from now on.
      example: 'false'
    notify_pilot:
      type: bool
      nullable: false
      desc: Whether the pilot is sent a direct message when an award is granted.
      example: 'true'
    notify_channel:
      type: int
      nullable: false
      desc: Discord channel id that announces awards. Omit for no announcement.
      example: '112233445566778899'
    rules:
      type: map
      nullable: false
      mapping:
        combat_readiness:
          include: combat_readiness_rule
        air_force_cross:
          include: air_force_cross_rule
        airmans_medal:
          include: airmans_medal_rule
        aerial_achievement:
          include: aerial_achievement_rule
        air_achievement:
          include: hardcore_rule
        air_commendation:
          include: hardcore_rule
        combat_action:
          include: combat_action_rule
      desc: One block per award rule. Each can be enabled independently.
type: map
func: check_main_structure
nullable: false
mapping:
  DEFAULT:
    include: element_schema
  commands:
    include: commands_schema
