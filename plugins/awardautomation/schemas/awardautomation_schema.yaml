    hours_per_award:
      type: int
      nullable: false
      range:
        min: 1
      desc: Flight hours per award granted. The rule repeats, so a pilot earns another at each multiple.
      example: '50'
    aircraft_types:
      include: aircraft_types
    scope:
      type: str
      nullable: false
      enum:
