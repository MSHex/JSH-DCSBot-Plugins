# Schema for awardautomation. `desc` and `example` are not decoration: the
# documentation site builds its configuration reference from them, and the
# 3.0.5.0 web admin GUI builds its config form from this same file.
schema;qualification_ids:
  type: seq
  nullable: false
  sequence:
  - type: int
    nullable: false
    range:
      min: 1
    unique: true
    desc: One entry in the list.
    example: '1'
  desc: Award ids that satisfy a qualification.
schema;aircraft_types:
  type: seq
  nullable: false
  sequence:
  - type: str
    nullable: false
    range:
      min: 1
    unique: true
    desc: One entry in the list.
    example: '1'
  desc: Aircraft types the rule counts hours for.
schema;hardcore_settings:
  type: map
  nullable: false
  mapping:
    server:
      type: str
      nullable: false
      required: true
      range:
        min: 1
      desc: Server whose Hardcore enrolment the medal is read from. This is the one that wins over a per-rule
        `server`.
      example: JSH Dynamic Campaign
  desc: Where the Hardcore medal reads enrolment from.
schema;combat_readiness_rule:
  type: map
  nullable: false
  mapping:
    enabled:
      type: bool
      nullable: false
      desc: Whether Combat Readiness is granted automatically.
      example: 'true'
    award_id:
      type: int
      nullable: false
      range:
        min: 1
      desc: Numeric award id in the awards table. Preferred over `award`.
      example: '7'
    award_name:
      type: str
      nullable: false
      range:
        min: 1
      desc: Award name shown to the pilot and written to the ledger.
      example: Air Medal
    award:
      type: str
      nullable: false
      range:
        min: 1
      desc: Deprecated since v1.3, kept so older configs keep working. New configurations use `award_id`
        instead.
      example: Air Medal
    credits:
      type: int
      nullable: false
      range:
        min: 0
      desc: Credits paid alongside the award. 0 grants the award only.
      example: '500'
    server:
      type: str
      nullable: false
      range:
        min: 1
      desc: Restricts the rule to one server. Deprecated for rules that are campaign-wide; the top-level
        `hardcore.server` wins for the Hardcore medal.
      example: JSH Dynamic Campaign
    qualifications:
      type: map
      nullable: false
      mapping:
        aar_ids:
          include: qualification_ids
          desc: Award ids that count as an air-to-air refuelling qualification.
          example: '[3]'
        ifr_ids:
          include: qualification_ids
          desc: Award ids that count as an instrument-rating qualification.
          example: '[4]'
      desc: Award ids that count toward each Combat Readiness qualification.
  desc: Rule granting Combat Readiness.
schema;hardcore_rule:
  type: map
  nullable: false
  mapping:
    enabled:
      type: bool
      nullable: false
      desc: Whether the Hardcore medal is granted automatically.
      example: 'true'
    award_id:
      type: int
      nullable: false
      range:
        min: 1
      desc: Numeric award id in the awards table. Preferred over `award`.
      example: '7'
    award_name:
      type: str
      nullable: false
      range:
        min: 1
      desc: Award name shown to the pilot and written to the ledger.
      example: Air Medal
    award:
      type: str
      nullable: false
      range:
        min: 1
      desc: Deprecated since v1.3, kept so older configs keep working. New configurations use `award_id`
        instead.
      example: Air Medal
    credits:
      type: int
      nullable: false
      range:
        min: 0
      desc: Credits paid alongside the award. 0 grants the award only.
      example: '500'
    sessions:
      type: int
      nullable: false
      range:
        min: 1
      desc: Number of qualifying sessions required.
      example: '25'
    server:
      type: str
      nullable: false
      range:
        min: 1
      desc: Restricts the rule to one server. Deprecated for rules that are campaign-wide; the top-level
        `hardcore.server` wins for the Hardcore medal.
      example: JSH Dynamic Campaign
  desc: Rule granting the Hardcore medal.
schema;air_force_cross_rule:
  type: map
  nullable: false
  mapping:
    enabled:
      type: bool
      nullable: false
      desc: Whether the Air Force Cross is granted automatically.
      example: 'true'
    award_id:
      type: int
      nullable: false
      range:
        min: 1
      desc: Numeric award id in the awards table. Preferred over `award`.
      example: '7'
    award_name:
      type: str
      nullable: false
      range:
        min: 1
      desc: Award name shown to the pilot and written to the ledger.
      example: Air Medal
    award:
      type: str
      nullable: false
      range:
        min: 1
      desc: Deprecated since v1.3, kept so older configs keep working. New configurations use `award_id`
        instead.
      example: Air Medal
    credits:
      type: int
      nullable: false
      range:
        min: 0
      desc: Credits paid alongside the award. 0 grants the award only.
      example: '500'
    minimum_flight_hours:
      type: int
      nullable: false
      range:
        min: 1
      desc: Flight hours a pilot must have before the rule considers them.
      example: '100'
    kd_ratio_over:
      type: float
      nullable: false
      range:
        min: 0.0
      desc: Kill/death ratio the pilot must exceed to qualify.
      example: '5.0'
    scope:
      type: str
      nullable: false
      enum:
      - campaign
      - server
      desc: Whether the qualifying figures are counted across the whole campaign or on one server.
      example: campaign
    server:
      type: str
      nullable: false
      range:
        min: 1
      desc: Restricts the rule to one server. Deprecated for rules that are campaign-wide; the top-level
        `hardcore.server` wins for the Hardcore medal.
      example: JSH Dynamic Campaign
  desc: Rule granting the Air Force Cross.
