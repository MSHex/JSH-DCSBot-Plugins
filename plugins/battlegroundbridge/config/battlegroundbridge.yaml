# battlegroundbridge -- copy to <bot>/config/plugins/battlegroundbridge.yaml
# on EVERY node.
#
# Sections are keyed on the INSTANCE name (the names under `instances:` in
# nodes.yaml), not the server names from servers.yaml. A section named after a
# server silently does nothing at all.
#
# `server_names` is a second, separate gate: the DCS server names this bridge
# may write for. Both must be satisfied, because a Battleground website entry
# can carry a display alias that is not the DCS server name, and the cost of
# getting that wrong is one server's intel appearing on another's map.

DEFAULT:
  enabled: false
  server_names: []
  # Clamped to 3-60 regardless of what is written here.
  poll_seconds: 5
  import_drawings: true
  # true logs a line per imported drawing -- useful the first time you deploy,
  # noise afterwards, since one mission can produce 60+ of them. The one-line
  # import summary is logged either way, and the detail is always on
  # /bgbridge status.
  debug: false
  drawing_layers: [Common]
  # Drawings still carrying a name DCS generated -- Polygon-2-1-1-1-1, Line-25,
  # Icon-2-2-2-1, Label-3 -- are imported WITHOUT a label, because on a busy
  # mission those strings cover the map and tell a pilot nothing.
  #
  # The trailing (-\d+)* is what makes this safe: it matches only the untouched
  # default shape, so anything a human typed keeps its name. Renaming a drawing
  # in the Mission Editor is still how you give it a label on the map.
  #
  # Set to '' to label everything.
  unlabelled_pattern: '^(Polygon|Line|Label|Icon|TextBox)(-\d+)*$'
  retain_intel_on_mission_change: true
  # 0 disables expiry. When positive, measured from the last DCS-driven change,
  # so edits made on the website never extend a report's life.
  intel_expiry_hours: 0
  # Draw a threat ring around anything whose title names a SAM system -- both
  # pilot-reported intel and imported mission labels. Rings follow a marker
  # that moves and vanish when its title stops naming a system.
  #
  # Radii are metres and are a DOCTRINE choice, not a physical constant: these
  # seed values are the ones JSH was already drawing by hand. Edit them, and
  # add systems, freely. Matching is case-insensitive and tolerates SA-10,
  # SA10 and SA 10; longer designations win, so SA-10 is never matched as SA-1.
  threat_rings:
    enabled: false
    colour: "#ff0000"
    label: "{name} Range"
    # Titles matching this never get a ring, so a point already describing a
    # ring does not acquire one of its own.
    skip_pattern: '\b(range|ring|coverage|envelope|umbrella|mez|wez)\b'
    systems:
      # A plain number is a radius in metres, using the colour and label above.
      # Decimals are fine -- these are the exact radii of the circles already
      # drawn by hand on the JSH map, so a generated ring lands precisely on
      # top of the manual one.
      SA-5: 297100.22
      SA-10: 119265.836
      SA-11: 51275.52
      #
      # A mapping overrides the colour and wording, which is how FRIENDLY
      # coverage is told apart from enemy threat. Note that only the colour
      # changes -- every ring is written to the same coalition as the rest of
      # this server's geometry, because a ring on the other side would be
      # invisible to the pilots who need it.
      #
      # Unlike the SA-5/10/11 radii above, which are the ones JSH was already
      # drawing by hand, these are starting points rather than measured values.
      # Set them to whatever your briefings assume before switching them on.
      #
      # Patriot:
      #   radius: 160000
      #   colour: "#0068ff"
      #   label: "{name} Coverage"
      # Hawk:
      #   radius: 40000
      #   colour: "#0068ff"
      #   label: "{name} Coverage"
      # NASAMS:
      #   radius: 25000
      #   colour: "#0068ff"
      #   label: "{name} Coverage"

  # Slots DCS gives no controllable unit for. A mark placed from one carries
  # NO initiator, so the bot cannot see who placed it from the event alone --
  # which is why Tactical Commander and Game Master reports used to be refused.
  #
  # When exactly ONE player on the marker's coalition is in such a slot, the
  # report is attributed to them: they are the only person who could have
  # placed it from one. With two, it would be a guess, and the wrong guess
  # files a report under someone else's name and lets them delete it -- so it
  # still refuses, and says so in the log.
  #
  # Matched as PREFIXES, because DCS numbers them per coalition:
  # artillery_commander_blue_1, forward_observer_red_2. Listing the bare name
  # covers every numbered variant.
  commander_slots:
    - instructor
    - artillery_commander
    - forward_observer
    - game-master
    - gamemaster
    - observer
    - spectator

  admin_roles: [DCS Admin, GameMaster]
  # UCIDs that may manage other players' reports even without a linked Discord
  # account. Real UCIDs must never be committed to a repository.
  admin_ucids: []

# Replace both names with your own. These are the instance name from
# nodes.yaml and the DCS server name from servers.yaml respectively.
your-instance-name:
  enabled: true
  server_names: [Your DCS Server Name]

# On a multi-node setup, qualify by node instead:
#
# YOUR_NODE_NAME:
#   your-instance-name:
#     enabled: true
#     server_names: [Your DCS Server Name]
