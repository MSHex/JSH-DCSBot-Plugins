schema;element_schema:
  type: map
  func: is_element
  nullable: false
  desc: Applies to every instance.
  mapping:
    enabled:
      type: bool
      nullable: false
      desc: Whether the airbase commands answer for this server.
      example: "true"
    warehouse_dir:
      type: str
      nullable: false
      range: {min: 1}
      desc: >-
        Folder holding the warehouse spreadsheets, relative to the bot or
        absolute. Supports {instance} and {server} placeholders.
      example: "config/warehouses"
    warehouse_file:
      type: str
      nullable: false
      range: {min: 1}
      desc: Spreadsheet read for an airbase's warehouse contents at a given level.
      example: "warehouse-lvl{level}.xlsx"

schema;instance_schema:
  type: map
  func: is_node
  nullable: false
  desc: Applies to one instance only.
  mapping:
    regex;(.+):
      include: 'element_schema'

type: map
func: check_main_structure
nullable: false
mapping:
  DEFAULT:
    include: 'element_schema'
  commands:
    include: 'commands_schema'
  regex;(.+):
    type: any
    func: any_of
    nullable: false
    enum: ['element_schema', 'instance_schema']
