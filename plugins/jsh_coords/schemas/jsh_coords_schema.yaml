schema;element_schema:
  type: map
  func: is_element
  nullable: false
  desc: Applies to every instance.
  mapping:
    enabled:
      type: bool
      nullable: false
      desc: Whether the coordinate conversion tool answers on this server.
      example: "true"
    unmark_roles:
      type: seq
      nullable: false
      desc: >-
        Discord roles, by name or ID, allowed to remove F10 markers with
        /coords unmark. Default: Admin, DCS Admin and GameMaster. Placing a
        marker is open to everyone.
      example: "[Admin, DCS Admin, GameMaster]"
      sequence:
        - type: text
          nullable: false
          desc: A Discord role name or ID.
          example: GameMaster

schema;instance_schema:
  type: map
  func: is_node
  nullable: false
  desc: Applies to one instance only.
  mapping:
    regex;(.+):
      include: 'element_schema'

type: map
func: check_main_structure
nullable: false
mapping:
  DEFAULT:
    include: 'element_schema'
  commands:
    include: 'commands_schema'
  regex;(.+):
    type: any
    func: any_of
    nullable: false
    enum: ['element_schema', 'instance_schema']
