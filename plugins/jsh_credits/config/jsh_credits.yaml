# Copy to <bot>/config/plugins/jsh_credits.yaml on BOTH nodes.
#
# DEFAULT applies to every server. To override a key for one server, add a
# section named after its INSTANCE (the names under "instances:" in nodes.yaml),
# not the server name from servers.yaml. An instance section only needs the keys
# it changes; everything else falls back to DEFAULT.
#
# Before deploying, see the repository README for the CreditSystem settings this
# plugin depends on: points_per_kill removed, points_on_rtb: false,
# multiplier: 1.0, and SlotBlocking payback off. Getting those wrong produces no
# error anywhere, just wrong balances.

DEFAULT:

  # ----------------------------------------------------------------- behaviour

  # false disables the plugin on a server: no holding, no payout, no ledger rows.
  enabled: true

  # Applied once, to the whole pending bucket, at payout. 2.0 pays double for
  # landing. Affects kills only -- this plugin credits nothing else.
  multiplier: 1.0

  # How much of the pending bucket a pilot keeps when the sortie ends badly --
  # crash, eject, pilot death, self-kill, disconnect or slot change. 0.25 leaves
  # them a quarter of what they earned; 0 is all-or-nothing. The rest is gone.
  # The multiplier applies to what is kept, as it does at payout.
  death_payout: 0.25

  # credits_log event for that partial payment, named after how the sortie
  # ended, so the log reads as what happened. Keep these distinct from 'rtb' so
  # the two can be told apart, and so the earned-vs-collected reconciliation in
  # the README keeps measuring landings only.
  partial_events:
    eject: ejected
    crash: crashed
    pilot_death: died
    self_kill: died
    disconnect: salvaged
    slot change: salvaged

  # Used for any ending not listed above.
  default_partial_event: salvaged

  # ------------------------------------------------------------------ messages
  #
  # Sent to the player in-game. Remove a key, or set it to '', to silence that
  # message. Each supports only the placeholders listed; an unknown one in your
  # text raises a KeyError and the message is lost.
  #
  #   held   {points}  this award       {total}  pending after it
  #          {reason}  always "kills"
  #   paid   {points}  paid, after multiplier    {place}  where they landed
  #          {old_points} / {new_points}  balance either side
  #          {reason}  the same detail written to the credits_log remark
  #   lost   {points}  pending at the time  {kept} 0  {lost} all of it
  #          {reason}  why (see below)
  #   salvaged  sent instead of `lost` when death_payout > 0
  #          {points}  pending at the time  {kept}  credited  {lost}  gone
  #          {reason}  why (see below)
  #
  # {reason} in `lost` and `salvaged` is one of: crash, eject, pilot_death,
  # self_kill, disconnect, slot change.

  messages:
    held: 'Pending: +{points} ({reason}). Total pending {total} - land at a friendly base to collect.'
    paid: 'Credits collected at {place}: +{points}. Balance {old_points} -> {new_points}.'
    lost: 'You lost {points} pending credits ({reason}).'
    salvaged: 'You went down with {points} pending ({reason}). {kept} recovered, {lost} lost.'

  # ----------------------------------------------------- credits_log remark
  #
  # The payout writes one 'rtb' row per landing, with a remark like:
  #   RTB Al-Asad Airbase: kills (86: 5x SA-18 Igla manpad, 3x tt_ZU-23, +8 more)

  # How many unit types to name before the "+N more" tail. 0 drops the detail
  # and leaves just the total: kills (86).
  remark_detail: 3

  # The remark is truncated past this many characters, so Discord embeds stay
  # readable. The column itself is TEXT and has no limit.
  remark_max_length: 200

  # ---------------------------------------------------------------- refuelling
  #
  # Credits for fuel taken from a tanker, measured by the mission and held like
  # a kill -- collected on landing, and subject to death_payout above if the
  # sortie ends badly. The pilot TAKING the fuel is paid, not the tanker.

  refuelling:
    enabled: true

    # Paid in whole blocks: 2 credits per 1000 lbs pays 2 at 1000-1999 lbs, 4 at
    # 2000-2999, nothing below 1000. A partial block is never rounded up.
    #
    # CHECK THIS AGAINST points_per_kill BELOW BEFORE RAISING IT. Fuel is
    # counted in thousands of pounds, so a rate that looks small per 100 lbs is
    # very large per sortie. Against the kill values further down -- 20 for a
    # player aircraft, 15 for an AI one, 8 for a helicopter:
    #
    #   rate               F-16 top-up (~7,000 lbs)   worth roughly
    #   2 per 1000 lbs     14 credits                 one AI aircraft
    #   5 per 1000 lbs     35 credits                 two player aircraft
    #   1 per 100 lbs      70 credits                 three player aircraft
    #   5 per 100 lbs     350 credits                 seventeen player aircraft
    #
    # Tanking is repeatable and carries no risk, which kills do.
    block_lbs: 1000
    credits_per_block: 2

    # Transfers below this earn nothing, so brushing the basket on the way past
    # is not worth credits. 0 pays everything above one whole block.
    minimum_lbs: 500

    # Most pounds that can be PAID FOR in one sortie. Fuel costs the pilot
    # nothing, so without a cap a sortie can orbit a tanker, burn the fuel off
    # in afterburner and tank again indefinitely. The counter resets whenever
    # the pending bucket does: on landing, crash, eject, death, slot change or
    # disconnect. 0 removes the cap.
    max_lbs_per_sortie: 20000

    # How it reads in the `held` message and in the RTB remark, e.g.
    # "RTB Al-Asad Airbase: kills (86: 3x Su-27), refuelling (14: 1x F-16C_50)"
    label: refuelling

  # -------------------------------------------------------------- kill scoring
  #
  # Evaluated top to bottom; the FIRST entry that matches wins. Order from most
  # specific to least, and put `default` last -- it matches everything, so any
  # entry below it is dead.
  #
  # Keys an entry may use, all of which must match for the entry to win:
  #   category    the victim's category, as the kill event reports it
  #   type        Player or AI -- whether the victim was a human player
  #   unit_type   exact DCS unit type name, e.g. SA-18 Igla manpad
  #   points      what to award when the entry matches
  #   default     shorthand for "match anything, award this"
  #
  # If every kill scores the default, your server's kill events are not
  # reporting a category: run the bot at DEBUG and look at a kill event, then
  # match on unit_type instead.

  points_per_kill:
  - category: Planes
    type: Player
    points: 20
  - category: Planes
    type: AI
    points: 15
  - category: Helicopters
    points: 8
  - category: Ships
    points: 10
  - category: Air Defence
    points: 8
  # An exact unit type, for a specific high-value target:
  # - unit_type: S-300PS 64H6E sr
  #   points: 25
  - default: 2

# ------------------------------------------------------------- per instance
# Instance names, NOT server names. Check config/nodes.yaml for yours.
#
# Turn the plugin off on a server that shouldn't use it:
#
# DedicatedServer:
#   enabled: false
#
# Or pay double for landing on one server (only the keys you list change):
#
# DCS.release_server:
#   multiplier: 2.0
