# Copy to <bot>/config/plugins/jsh_csar.yaml on BOTH nodes.
# DEFAULT applies to every server. A section named after an instance (the names
# under "instances:" in nodes.yaml) overrides DEFAULT for that server only.
DEFAULT:
  enabled: true             # set to false here to make it opt-in per instance
  dynamic_campaign: false   # true on the dynamic campaign servers only: their
                            # rescues also feed jsh_csar_dynamic, the per-status
                            # breakdown table

  credits_log_event: csar   # value written to the event column of credits_log
  announce_in_game: true    # set false to let the credit system do the talking

  # How each status reads in the credit log remark and the in-game message,
  # e.g. "for rescuing 2 critical pilots". An "s" is added for plurals.
  labels:
    Healthy: pilot
    Wounded: wounded pilot
    Critical: critical pilot
    RedPilot: captured enemy pilot
    Unknown: pilot

  # Credits per rescued pilot, by pilot status. Rescues are always recorded in
  # the database, even where the reward is 0.
  # Healthy / Wounded / Critical come from the Joker ADV_CSAR script.
  # RedPilot is a captured enemy pilot: ADV_CSAR, or a Foothold "Enemy Pilot
  # Capture" delivery.
  # Unknown is used by CSAR scripts that report no pilot condition
  # (Foothold friendly rescues, Ciribob CSAR, MOOSE Ops.CSAR).
  rewards:
    Healthy: 50
    Wounded: 75
    Critical: 100
    RedPilot: 150
    Unknown: 50


# ---------------------------------------------------------------- per instance
# Turn the plugin off on servers that shouldn't use it:
#
# DedicatedServer:
#   enabled: false
#
# Or pay more on one server (only the keys you list change):
#
# DCS.release_server:
#   dynamic_campaign: true
#   rewards:
#     Critical: 150
