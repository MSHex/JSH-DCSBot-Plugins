schema;reward_map:
  type: map
  nullable: false
  desc: Credits paid per rescued pilot condition. Keys match Joker ADV_CSAR's own condition names.
  mapping:
    Healthy: {type: int, nullable: false, range: {min: 0}, desc: "Credits for rescuing an unhurt pilot.", example: "50"}
    Wounded: {type: int, nullable: false, range: {min: 0}, desc: "Credits for rescuing a wounded pilot.", example: "75"}
    Critical: {type: int, nullable: false, range: {min: 0}, desc: "Credits for rescuing a critically injured pilot.", example: "100"}
    RedPilot: {type: int, nullable: false, range: {min: 0}, desc: "Credits for recovering a downed enemy pilot.", example: "150"}
    Unknown: {type: int, nullable: false, range: {min: 0}, desc: "Credits when the condition was not reported.", example: "50"}

schema;label_map:
  type: map
  nullable: false
  desc: Wording used in the ledger entry and the in-game message for each condition.
  mapping:
    Healthy: {type: str, nullable: false, range: {min: 1}, desc: "Label for an unhurt pilot.", example: "healthy pilot"}
    Wounded: {type: str, nullable: false, range: {min: 1}, desc: "Label for a wounded pilot.", example: "wounded pilot"}
    Critical: {type: str, nullable: false, range: {min: 1}, desc: "Label for a critically injured pilot.", example: "critical pilot"}
    RedPilot: {type: str, nullable: false, range: {min: 1}, desc: "Label for a recovered enemy pilot.", example: "enemy pilot"}
    Unknown: {type: str, nullable: false, range: {min: 1}, desc: "Label used when the condition was not reported.", example: "pilot"}

schema;element_schema:
  type: map
  func: is_element
  nullable: false
  desc: Applies to every instance.
  mapping:
    enabled:
      type: bool
      nullable: false
      desc: Whether CSAR rescues are paid on this server.
      example: "true"
    dynamic_campaign:
      type: bool
      nullable: false
      desc: >-
        True pays into the running campaign's credit pool; false pays the
        player's standing balance.
      example: "true"
    credits_log_event:
      type: str
      nullable: false
      range: {min: 1}
      desc: Value written to the credits_log `event` column, so CSAR payouts can be reported on separately.
      example: "csar"
    announce_in_game:
      type: bool
      nullable: false
      desc: Whether the rescuing pilot is told in game what they were paid.
      example: "true"
    labels:
      include: 'label_map'
    rewards:
      include: 'reward_map'

schema;instance_schema:
  type: map
  func: is_node
  nullable: false
  desc: Applies to one instance only.
  mapping:
    regex;(.+):
      include: 'element_schema'

type: map
func: check_main_structure
nullable: false
mapping:
  DEFAULT:
    include: 'element_schema'
  commands:
    include: 'commands_schema'
  regex;(.+):
    type: any
    func: any_of
    nullable: false
    enum: ['element_schema', 'instance_schema']
