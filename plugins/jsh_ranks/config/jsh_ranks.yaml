# Copy to <bot>/config/plugins/jsh_ranks.yaml on BOTH nodes.
#
# DEFAULT applies to every server. A section named after an instance (the names
# under "instances:" in nodes.yaml) overrides DEFAULT for that server only.
#
# This plugin only does anything on a Foothold mission, and only matters when
# RankingSystem = true in Foothold_Config.lua -- with it false, Foothold applies
# no rank gates at all and there is nothing for these levels to govern.

DEFAULT:
  enabled: false            # opt in per instance; see the example at the bottom

  # How often to re-send ranks while people are flying, in minutes. Credits and
  # playtime both move during a session, so a pilot can earn a promotion
  # mid-flight. 0 disables the refresh and ranks update only on connect and
  # slot change.
  refresh_minutes: 10

  # Used for a pilot with no rank yet, and for any rank missing from rank_map.
  default_level: 1

  # Maps the Discord ladder in creditsystem.yaml onto Foothold's rank numbers.
  # Keys are the achievement's `role` in creditsystem.yaml, exactly as written.
  #
  # Foothold has 20 ranks, Recruit (1) to General of the Air Force (20) -- see
  # rankNames and rankThresholds in zoneCommanderv2.lua. Twelve of them share a
  # name with a Discord rank, so the mapping below matches by name. That matters
  # because Foothold prints its OWN rank names in shop messages (getRankName), so
  # a pilot at level 12 is told "Captain" and it agrees with Discord.
  #
  # The only mismatch is Command Chief Master Sergeant, which Foothold has no
  # equivalent for. It shares level 9 with Chief Master Sergeant; giving it its
  # own level would shift every officer up one and make all six displayed names
  # wrong. Nothing in the game gates above 10, so sharing costs no access.
  #
  # Check what YOUR map actually requires before changing these: the gate values
  # live in ShopRankRequirements in Foothold Config.lua (1-10 on current
  # versions) and in the CTLDPrices table in Foothold CTLD.lua (1-3). A map
  # whose highest requirement exceeds your highest mapped level leaves those
  # items permanently unbuyable by anyone.
  rank_map:
    Airman Basic (E-1): 1                  # Recruit
    Airman (E-2): 2                        # Aviator
    Airman First Class (E-3): 3            # Airman
    Senior Airman (E-4): 4                 # Senior Airman
    Staff Sergeant (E-5): 5                # Staff Sergeant
    Technical Sergeant (E-6): 6            # Technical Sergeant
    Master Sergeant (E-7): 7               # Master Sergeant
    Senior Master Sergeant (E-8): 8        # Senior Master Sergeant
    Chief Master Sergeant (E-9): 9         # Chief Master Sergeant
    Command Chief Master Sergeant (E-9S): 9    # shares 9; see above
    Second Lieutenant (O-1): 10            # Second Lieutenant
    First Lieutenant (O-2): 11             # First Lieutenant
    Captain (O-3): 12                      # Captain
    Major (O-4): 13                        # Major
    Lieutenant Colonel (O-5): 14           # Lieutenant Colonel
    Colonel (O-6): 15                      # Colonel

  # ------------------------------------------------- granted-only ranks
  #
  # Ranks that CANNOT be earned, and exist only to be handed out by
  # `/ranks grant` -- moderator and admin ranks that should not fall out of
  # credits or flight hours.
  #
  # These are the ranks you commented out of creditsystem.yaml's achievements.
  # Leave them commented out: being absent from `achievements` is exactly what
  # makes them safe for this plugin to own. CreditSystem's process_achievements
  # walks `config['achievements']` and only ever adds or removes a role named
  # by one of those entries, so a role that is not on that list is never
  # touched by it. Put one back under `achievements` and CreditSystem will
  # start stripping it from anyone who has not earned it.
  #
  #   role   the Discord role to assign. A name as written in Discord, or the
  #          numeric role ID. Defaults to the rank name itself.
  #   level  the Foothold rank number. A granted-only rank is not on the
  #          ladder, so rank_map cannot cover it -- set the level here.
  #   status a short label -- Admin, Staff, Moderator -- shown by /pilot status
  #          in place of promotion progress, since a granted rank has nothing
  #          to progress toward. Wrapped by `granted_status_format` below, so
  #          the wording is changed in ONE place rather than on every rank.
  #          Defaults to `default_granted_status`.
  #   badge  the artwork /pilot status shows as its thumbnail. Same shape as
  #          creditsystem.yaml's own `badge`, so a rank you commented out of
  #          `achievements` keeps its image by pasting the block across
  #          unchanged. `name` defaults to the rank, so only `img` is needed.
  #          Without one, /pilot status falls back to the EARNED rank's badge
  #          rather than showing no thumbnail at all.
  #
  # The bot needs the "Manage Roles" permission, and its own role must sit
  # ABOVE these roles in Server Settings -> Roles, or Discord refuses the
  # change. `/ranks grant` tells you when that is what went wrong.
  #
  # Discord shows a member in the colour of their highest-positioned role, so
  # place these above the ladder roles if you want the moderator rank to be the
  # one that shows.
  #
  # How a granted rank's `status` label is worded in /pilot status. Both
  # placeholders are optional: {status} is the rank's own label, {rank} its
  # name. This is the one line to edit to change the wording everywhere.
  #
  # granted_status_format: '🏆 {status} — outside the campaign ladder.'
  #
  # Used by a granted rank that sets no `status:` of its own.
  #
  # default_granted_status: Granted rank

  # The ranks below are the ones commented out of creditsystem.yaml, moved
  # here with their badge blocks carried across unchanged, plus O-11 which was
  # never in that file at all. Foothold's ladder ends at 20 (General of the
  # Air Force), so O-9, O-10 and O-11 map to 18, 19 and 20.
  #
  # granted_ranks:
  #   Lieutenant General (O-9):
  #     role: Lieutenant General (O-9)
  #     level: 18
  #     status: Staff
  #     badge:
  #       name: Lieutenant General (O-9)
  #       img: https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/US_Air-force_O9_class_b.svg/960px-US_Air-force_O9_class_b.svg.png
  #   General (O-10):
  #     role: General (O-10)
  #     level: 19
  #     status: Admin
  #     badge:
  #       name: General (O-10)
  #       img: https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/US_Air-force_O10_class_b.svg/960px-US_Air-force_O10_class_b.svg.png
  #   General of the Air Force (O-11):
  #     role: General of the Air Force (O-11)
  #     level: 20
  #     status: Admin
  #   # Shorthand: a bare number is the level, with the role named after the
  #   # rank and no badge or status, so this is the same as
  #   # `role: Founder, level: 20`.
  #   Founder: 20

  # A LADDER rank handed out by `/ranks grant` is not exempt from rank_map: it
  # is looked up here like any other, so a rung set beyond reach on purpose
  # still needs a line above or the pilot holding it drops to default_level and
  # the grant appears to do nothing. `/ranks grant` says so when it spots the
  # gap, but only for servers where this plugin is enabled.
  #
  # A granted-only rank from `granted_ranks` carries its own `level` and needs
  # nothing here.
  #
  # Foothold's own ranks stop at 20, so that is the ceiling for a granted rank
  # too; a higher number is simply clamped by the mission.

  # --------------------------------------------- cbuy: for commanders
  #
  # Foothold's own `buy:` marker CANNOT work from a Tactical Commander or Game
  # Master slot, and this is a DCS limitation rather than a Foothold bug: DCS
  # attaches no initiator to a mark placed from a slot with no controllable
  # unit, so zoneCommanderv2.lua leaves the rank at 0 and refuses every gated
  # item. Mission-side Lua cannot identify such a player either --
  # coalition.getPlayers() returns units, and a commander has none.
  #
  # The bot can, because it knows who is connected and in which slot. It pushes
  # the commanding level per coalition on every refresh, and the mission script
  # authorises `cbuy:` against that before calling Foothold's own buyShopItem.
  #
  # NOTHING IN FOOTHOLD IS MODIFIED, so a Foothold update cannot undo it. The
  # cost is that this leans on Foothold's internals -- _G.bc,
  # bc.shops[coalition][id].reqRank, and the buyShopItem signature. If a future
  # Foothold renames those, cbuy stops working and says so in dcs.log, which is
  # a better failure than a patched file silently reverting on update.
  #
  # Usage, from a commander slot: place a marker reading
  #
  #     cbuy: zhawk
  #
  # using the same item ids as Foothold's own `buy:`. PLACE THE MARKER ON THE
  # ZONE you are buying for: zone-targeted items (zsam, zhawk, supplies) take
  # their target from where the marker sits, exactly as `buy:` does. A marker
  # outside any zone gets Foothold's "choose a zone from shop menu".
  #
  # The marker is removed once handled, and the result is announced to the
  # coalition.
  #
  # `cbuy:` rather than `buy:` deliberately: Foothold's handler still fires on
  # `buy:` and would print "insufficient rank" beside a successful purchase,
  # and its handler cannot be stopped without editing it. Foothold matches
  # nothing on `cbuy:`.
  #
  # The HIGHEST-ranked commander on a coalition sets the level. Unlike
  # attributing an intel report, two commanders is not a reason to refuse --
  # nobody's name goes on a purchase, and refusing while two admins are on the
  # map is the failure this exists to remove.
  #
  # Requires RankingSystem = true in Foothold_Config.lua. With it false,
  # Foothold applies no gates at all and cbuy simply buys.

  # Optional, and unnecessary with a name-matched rank_map: Foothold's own names
  # already agree with Discord. Only worth setting if you compress several
  # Discord ranks onto one level, where these name the band rather than the
  # pilot's exact rank. Leave it out to keep Foothold's names.
  # level_names:
  #   '1': Enlisted
  #   '5': NCO
  #   '10': Officer

# ---------------------------------------------------------------- per instance
# Turn it on only for the Foothold servers:
#
# DCS.Foothold:
#   enabled: true
