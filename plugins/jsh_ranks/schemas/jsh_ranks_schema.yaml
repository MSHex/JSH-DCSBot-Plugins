schema;badge:
  type: map
  nullable: false
  desc: >-
    Artwork shown as the /pilot status thumbnail. Same shape as
    creditsystem.yaml's own badge, so a rank commented out of `achievements`
    keeps its image by pasting the block across unchanged.
  mapping:
    name:
      type: str
      nullable: false
      range: {min: 1}
      desc: Badge name. Defaults to the rank name.
      example: "General (O-10)"
    img:
      type: str
      nullable: false
      range: {min: 1}
      desc: Image URL. Without one, /pilot status falls back to the earned rank's badge.
      example: "https://upload.wikimedia.org/.../US-O10_insignia.svg.png"

schema;granted_rank:
  type: map
  nullable: false
  desc: One rank that cannot be earned and is handed out by /ranks grant.
  mapping:
    role:
      type: str
      nullable: false
      range: {min: 1}
      desc: >-
        Discord role to assign, by name or numeric ID. Defaults to the rank
        name. Leave the rank commented out of creditsystem.yaml's achievements
        so CreditSystem never strips the role.
      example: "General (O-10)"
    level:
      type: int
      nullable: false
      range: {min: 1, max: 20}
      desc: >-
        Foothold rank number. A granted-only rank is not on the ladder, so
        rank_map cannot cover it. Must clear your highest ShopRankRequirements
        entry if the holder should have the whole shop.
      example: "19"
    status:
      type: str
      nullable: false
      range: {min: 1}
      desc: >-
        Short label shown by /pilot status in place of promotion progress,
        since a granted rank has nothing to progress toward.
      example: "Admin"
    badge:
      include: 'badge'

schema;element_schema:
  type: map
  func: is_element
  nullable: false
  desc: Applies to every instance.
  mapping:
    enabled:
      type: bool
      nullable: false
      desc: >-
        Whether ranks are pushed to this server. Only meaningful on a Foothold
        mission with RankingSystem = true in Foothold_Config.lua.
      example: "true"
    refresh_minutes:
      type: int
      nullable: false
      range: {min: 0}
      desc: >-
        How often ranks are re-sent while people fly, since credits and
        playtime move mid-session. 0 updates only on connect and slot change.
      example: "5"
    default_level:
      type: int
      nullable: false
      range: {min: 1, max: 20}
      desc: Level used for a pilot with no rank yet, and for any rank missing from rank_map.
      example: "1"
    rank_map:
      type: map
      nullable: false
      desc: >-
        Maps each creditsystem.yaml achievement `role`, written exactly as it
        appears there, onto a Foothold rank number. A rank missing here falls
        back to default_level, which looks like the rank doing nothing.
      mapping:
        regex;(.+):
          type: int
          nullable: false
          range: {min: 1, max: 20}
          desc: Foothold rank number for this Discord rank.
          example: "12"
    granted_ranks:
      type: map
      nullable: false
      desc: Ranks that exist only to be granted by /ranks grant, keyed by rank name.
      mapping:
        regex;(.+):
          type: any
          nullable: false
          desc: >-
            Either a mapping (role, level, status, badge) or a bare integer,
            which is shorthand for the level with the role named after the rank.
          example: "20"
    granted_status_format:
      type: str
      nullable: false
      range: {min: 1}
      desc: >-
        Wording /pilot status shows for a granted rank. {status} is the rank's
        own label and {rank} its name; both are optional. An unrecognised
        placeholder falls back to the bare label rather than failing.
      example: "🏆 {status} — outside the campaign ladder."
    default_granted_status:
      type: str
      nullable: false
      range: {min: 1}
      desc: Label used by a granted rank that sets no `status` of its own.
      example: "Granted rank"
    level_names:
      type: map
      nullable: false
      desc: >-
        Optional display names per Foothold level. Only worth setting when
        several Discord ranks share one level. Leave out to keep Foothold's own names.
      mapping:
        regex;(.+):
          type: str
          nullable: false
          range: {min: 1}
          desc: Name shown for this Foothold level.
          example: "Officer"
    promotions:
      type: map
      nullable: false
      desc: >-
        Post a message when a pilot EARNS a higher rank through credits and
        flight hours. Granted ranks are not announced. Read from DEFAULT only:
        a rank-up is a Discord event, not tied to one server.
      mapping:
        channel:
          type: int
          nullable: false
          desc: Discord channel ID to post rank-ups in. Leave out to post nothing.
          example: "123456789012345678"
        message:
          type: str
          nullable: false
          range: {min: 1}
          desc: >-
            The message. Placeholders: {mention} {name} {old_rank} {new_rank}
            {old_code} {new_code}. A template with a mistake falls back to the
            default. Used with style: text.
          example: "Congratulations {mention}, you ranked up from {old_rank} to {new_rank}!"
        style:
          type: str
          nullable: false
          enum: [embed, text]
          desc: An embedded card (the default) or the plain text `message`.
          example: embed
        title:
          type: str
          nullable: false
          desc: >-
            The card's title. Placeholders as for message, plus {rank} (the new
            rank without its code) and {old} (the old one).
          example: "Promoted to {rank} · {new_code}"
        description:
          type: str
          nullable: false
          desc: The line under the title.
          example: "{mention} reached **{new_code}**."
        unlocks:
          type: map
          nullable: false
          desc: >-
            What each rank unlocks, shown under "Unlocked", keyed by code (E-3)
            or full rank name. Ranks not listed show no Unlocked section.
          example: "{E-5: 'Members campaign and PvP servers'}"
          mapping:
            regex;(.+):
              type: str
              nullable: false
              desc: The text for this rank.
              example: "Members campaign and PvP servers"
        unlocked_label:
          type: str
          nullable: false
          desc: The heading over the unlock text.
          example: Unlocked
        insignia:
          type: map
          nullable: false
          desc: >-
            An image URL per rank, shown on the right of the card, keyed by code
            or full rank name. A rank not listed uses its Discord role's icon,
            if it has one.
          example: "{E-3: 'https://example.com/e3.png'}"
          mapping:
            regex;(.+):
              type: str
              nullable: false
              desc: A direct image URL.
              example: "https://example.com/e3.png"
        colour:
          type: str
          nullable: false
          desc: Bar colour as hex. Omit to use the rank role's colour, or gold.
          example: "#F1C40F"
        footer:
          type: str
          nullable: false
          desc: Small text at the bottom of the card. Omit for none.
          example: "Fly safe, come home."
    officer_roles:
      type: map
      nullable: false
      desc: >-
        Extra Discord roles held by rank band, keyed by pay-grade code (O-1)
        or full rank name. Each step applies at and above its rank, in ladder
        order, so skipped ranks, demotions and campaign resets all come out
        right. Granted ranks count. Read from DEFAULT only.
      mapping:
        regex;(.+):
          type: map
          nullable: false
          desc: Roles to add and remove from this rank upwards.
          mapping:
            add:
              type: seq
              nullable: false
              desc: Discord roles to give from this rank up, by name or ID.
              example: "Officer"
              sequence:
                - type: scalar
                  nullable: false
                  desc: A Discord role, by name or by ID.
                  example: "1515874158943146004"
            remove:
              type: seq
              nullable: false
              desc: Discord roles to take away from this rank up, by name or ID.
              example: "Junior Officer"
              sequence:
                - type: scalar
                  nullable: false
                  desc: A Discord role, by name or by ID.
                  example: "1515874158943146004"
    rank_decay:
      type: map
      nullable: false
      desc: >-
        Lower rank roles that inactivity decay has taken away, instead of
        waiting for the pilot's next disconnect. Demotions only, from the same
        credits, hours and rule CreditSystem uses. Members holding a grant are
        skipped. Runs on the master node. Read from DEFAULT only.
      mapping:
        enabled:
          type: bool
          nullable: false
          desc: Run the scheduled check.
          example: "true"
        campaign_id:
          type: int
          nullable: false
          range: {min: 1}
          desc: The campaign whose credits decide rank -- the one InactivityDecay deducts from.
          example: "1"
        interval_minutes:
          type: int
          nullable: false
          range: {min: 10}
          desc: Minutes between checks.
          example: "60"
        dry_run:
          type: bool
          nullable: false
          desc: >-
            Only log what would change. On by default; turn it off once the
            log looks right.
          example: "true"

schema;instance_schema:
  type: map
  func: is_node
  nullable: false
  desc: Applies to one instance only.
  mapping:
    regex;(.+):
      include: 'element_schema'

type: map
func: check_main_structure
nullable: false
mapping:
  DEFAULT:
    include: 'element_schema'
  commands:
    include: 'commands_schema'
  regex;(.+):
    type: any
    func: any_of
    nullable: false
    enum: ['element_schema', 'instance_schema']
