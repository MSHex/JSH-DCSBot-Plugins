DEFAULT:
  enabled: true
  # Discord channel the trapsheet is posted to. Leave it out and nothing is
  # posted -- the pass is still stored and still shows up in /traps.
  # greenieboard itself only posts a one-line text message to the events
  # channel and never attaches the picture, so without this the plot is only
  # ever seen by someone running /traps.
  # channel: 123456789012345678
  # Seconds between samples. 10 Hz is well above what the signals need:
  # glideslope and lineup are smooth, and AoA oscillates at roughly 0.5-2 Hz,
  # so this is comfortably past Nyquist. Going faster mainly samples DCS's own
  # frame jitter and costs that work on every approach.
  sample_rate: 0.1
  # Start sampling inside this range of the deck, below this height above it.
  capture_range_nm: 1.5
  capture_ceiling_ft: 1500
  # Hard cap per pass, so a long go-around cannot grow without bound.
  max_points: 600
  # Deck types to sample, matched as PREFIXES. Only Super Carrier decks raise
  # S_EVENT_LANDING_QUALITY_MARK, so a pass anywhere else could never be
  # graded. Filtering mission-side means a legacy deck costs no sampling work
  # and sends nothing. Add a legacy hull here only if you want ungraded plots.
  carrier_types:
    - CVN_
    - CV_59
    - Forrestal
  # Seconds to hold a finished pass waiting for its LSO grade. If none
  # arrives the pass is DISCARDED, not plotted -- it only happens when the
  # grade was genuinely lost, such as a disconnect mid-pass.
  grade_wait: 20
  axes:
    # Flip if the plotted approach comes out mirrored. Which way is 'astern'
    # and which is 'starboard' is a convention to confirm against one real
    # trap, not something to reason out -- see the README.
    invert_x: false
    invert_z: false

your-instance-name:
  enabled: true
