type: map
func: check_main_structure
mapping:
  DEFAULT:
    include: jsh_trapsheet
  regex;(.+):
    type: map
    func: is_node
    desc: >-
      Per-instance overrides, keyed on the INSTANCE name from nodes.yaml --
      never the server name from servers.yaml. A section named after a server
      validates as a map but matches no instance, so it silently does nothing.
    example: DCS.Foothold
    mapping:
      regex;(.+):
        include: jsh_trapsheet

schema;jsh_trapsheet:
  type: map
  mapping:
    enabled:
      type: bool
      nullable: false
      desc: Whether approaches are sampled on this instance.
      example: "true"
    channel:
      type: int
      nullable: false
      desc: >-
        Discord channel id the trapsheet is posted to. Omit it and nothing is
        posted; the pass is still stored and still appears in /traps.
        greenieboard itself only posts a one-line text message to the events
        channel and never attaches the picture, so without this the plot is
        only ever seen by someone running /traps.
      example: "123456789012345678"
    sample_rate:
      type: float
      nullable: false
      desc: >-
        Seconds between samples. 0.1 (10 Hz) is well above what the data
        needs: glideslope and lineup are smooth, and AoA oscillates at roughly
        0.5-2 Hz. A smaller value mostly samples DCS frame jitter and costs
        that work on every approach.
      example: "0.1"
    capture_range_nm:
      type: float
      nullable: false
      desc: Start sampling once the aircraft is within this many nautical miles of the deck.
      example: "1.5"
    capture_ceiling_ft:
      type: float
      nullable: false
      desc: Only sample below this height above the deck, in feet.
      example: "1500"
    max_points:
      type: int
      nullable: false
      desc: >-
        Hard cap on samples per pass, so a long go-around inside the capture
        window cannot grow without bound.
      example: "600"
    carrier_types:
      type: seq
      nullable: false
      desc: >-
        Deck type names to sample, matched as PREFIXES. Only Super Carrier
        decks raise S_EVENT_LANDING_QUALITY_MARK, so a pass anywhere else
        could never be graded; filtering here means a legacy deck costs no
        sampling work and sends no datagrams. Prefixes because the Super
        Carrier hulls are numbered individually (CVN_71, CVN_72...).
      example: "CVN_"
      sequence:
        - type: str
          nullable: false
          desc: A deck type-name prefix, such as CVN_ or Forrestal.
          example: "CVN_"
    grade_wait:
      type: float
      nullable: false
      desc: >-
        Seconds to hold a finished pass waiting for its LSO grade. If none
        arrives the pass is discarded rather than plotted, which only happens
        when the grade was genuinely lost, such as a disconnect mid-pass.
      example: "20"
    night:
      type: bool
      nullable: false
      desc: Whether passes on this instance are recorded as night traps.
      example: "false"
    axes:
      type: map
      nullable: false
      desc: >-
        Sign corrections for the carrier-relative frame. Which way is astern
        and which is starboard is a convention to confirm against one real
        trap, not to reason out.
      mapping:
        invert_x:
          type: bool
          nullable: false
          desc: Flip the along-deck axis if the approach plots back to front.
          example: "false"
        invert_z:
          type: bool
          nullable: false
          desc: Flip the lateral axis if lineup is mirrored left for right.
          example: "false"
